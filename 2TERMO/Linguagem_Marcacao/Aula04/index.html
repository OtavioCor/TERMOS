<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Imagens/SmartCoffee_favicon0.2.ico" type="image/x-icon"> <!-- Fav Icons no maximo 256 -->
    <!-- Ctrl + espaço = opções de imagem -->
    <title>FAVICONS e IMAGENS</title>
</head>
<body>
    <h1>Imagens do Google</h1>
    <!-- img = tag para acrescentar imagens-->
    <!-- src = adicionar a imagem -->
    <!-- alt = Descrição de imagem, caso elas seja perdida ou bug-->
    <!-- title = descreve a imagem  -->
    <!-- align = onde ficará a imagem -->
    <div>
         <img src="Imagens/uniqua.png" alt="Uniqua" title="Personagem Uniqua" align="right">
    </div>

    <!-- div = cria uma divisão  -->

    <div>
        <h2>Uniqua - com proporção de imagens</h2>
        <img src="Imagens/uniqua.png" 
        alt="Uniqua" 
        title="Uniqua"
        width="200px"
        height="700px"
        border-radius: 10px>
    </div>
    <!-- style = formatação melhor para a imagem  -->
    <h2>Uniqua - com proporção de imagem com style</h2>
    <div>
        <img src="Imagens/uniqua.png" 
        alt="Uniqua"
        title="Uniqua"
        style=
        "margin: 20px;
        height: 500px;
        width: 500px;
        background-image: url(Imagens/uniqua.png);
        background-size: auto;
        background-repeat: repeat-y;">
    </div>
</body>
</html>
